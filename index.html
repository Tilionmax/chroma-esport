<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Planning Équipe v3</title>

  <link rel="stylesheet" href="style.css">

  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
</head>

<body>

<div class="container">
  <h1>📅 Planning équipe v3</h1>

  <div id="calendar"></div>

  <div class="stats">
    <h3>📊 Statistiques présence</h3>
    <div id="stats"></div>
  </div>
</div>

<!-- MODAL -->
<div id="modal" class="modal hidden">
  <div class="modal-content">

    <h2>➕ Créer entraînement</h2>

    <input id="title" placeholder="Nom séance">

    <h3>🧑 Disponibilité joueurs</h3>
    <p class="hint">Coche ceux disponibles</p>

    <div id="players"></div>

    <button id="saveBtn">Créer</button>
    <button id="closeBtn">Annuler</button>

  </div>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
