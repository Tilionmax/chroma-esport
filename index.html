<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Chroma Esport Planning</title>

  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
  <h1>Chroma Esport - Planning</h1>

  <div id="calendar"></div>
</div>

<!-- MODAL AJOUT -->
<div id="availModal" class="modal hidden" onclick="closeAddBackdrop(event)">
  <div class="modal-content" onclick="event.stopPropagation()">

    <h3>Ajouter disponibilité</h3>

    <input id="playerName" placeholder="Pseudo">
    <input id="startHour" type="time">
    <input id="endHour" type="time">

    <button id="saveAvailBtn">Valider</button>
    <button id="closeAvailBtn">Fermer</button>

  </div>
</div>

<!-- MODAL EDIT -->
<div id="editModal" class="modal hidden" onclick="closeEditBackdrop(event)">
  <div class="modal-content" onclick="event.stopPropagation()">

    <h3>Ma disponibilité</h3>

    <p id="editInfo"></p>

    <input id="editStart" type="time">
    <input id="editEnd" type="time">

    <button id="updateBtn">Modifier</button>
    <button id="deleteBtn">Supprimer</button>
    <button onclick="closeEditModal()">Fermer</button>

  </div>
</div>

<script type="module" src="script.js"></script>

</body>
</html>
