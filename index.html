<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Chroma Esport Dashboard</title>

  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- SIDEBAR STYLE DISCORD -->
  <div class="sidebar">
    <h2>⚡ Chroma</h2>
    <p class="nav">📅 Planning</p>
    <p class="nav">🟢 Disponibilités</p>
  </div>

  <!-- MAIN -->
  <div class="main">

    <h1>Planning Équipe Esport</h1>

    <div id="calendar"></div>

  </div>
</div>

<!-- MODAL AJOUT -->
<div id="availModal" class="modal hidden" onclick="closeAddBackdrop(event)">
  <div class="modal-content" onclick="event.stopPropagation()">

    <h3>Ajouter disponibilité</h3>

    <input id="playerName" placeholder="Pseudo">

    <input id="startHour" placeholder="HH:MM" inputmode="numeric">
    <input id="endHour" placeholder="HH:MM" inputmode="numeric">

    <button id="saveAvailBtn">Valider</button>
    <button id="closeAvailBtn">Fermer</button>

  </div>
</div>

<!-- MODAL EDIT -->
<div id="editModal" class="modal hidden" onclick="closeEditBackdrop(event)">
  <div class="modal-content" onclick="event.stopPropagation()">

    <h3>Gestion disponibilité</h3>

    <p id="editInfo"></p>

    <input id="editStart" placeholder="HH:MM">
    <input id="editEnd" placeholder="HH:MM">

    <button id="updateBtn">Modifier</button>
    <button id="deleteBtn">Supprimer</button>
    <button onclick="closeEditModal()">Fermer</button>

  </div>
</div>

<script type="module" src="script.js"></script>

</body>
</html>
