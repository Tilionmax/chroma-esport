<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Chroma Esport - Planning</title>

  <link rel="stylesheet" href="style.css">

  <!-- FullCalendar -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
</head>

<body>

<div class="container">
  <h1>📅 Planning Chroma Esport</h1>

  <div id="calendar"></div>

  <div class="stats">
    <h3>📊 Infos événement</h3>
    <div id="stats">Clique sur un jour</div>
  </div>
</div>

<!-- MODAL -->
<div id="modal" class="modal hidden">
  <div class="modal-content">

    <h2>➕ Créer un événement</h2>

    <input id="title" placeholder="Nom de la session">

    <button id="saveBtn">Créer</button>
    <button id="closeBtn">Annuler</button>

  </div>
</div>

<script src="script.js"></script>

</body>
</html>
