<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chroma Esport Planning</title>

  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <h1>CHROMA ESPORT<br>Overwatch Team Schedule</h1>

  <div id="currentPlayerDisplay">
    <button id="changePlayerBtn" class="edit-btn">✏️Edit Username</button>
    <span id="playerText"></span>
  </div>

  <div id="calendar"></div>

  <div class="week-bar">
    <div id="weekRange"></div>
    <div id="weekDays"></div>
  </div>

  <div class="stats">
    <h3>🟢 Available players</h3>
    <div id="playersList">Clique sur un jour</div>
  </div>

</div>

<!-- AVAILABILITY -->
<div id="availModal" class="modal hidden" onclick="closeAvailModal()">
  <div class="modal-content" onclick="event.stopPropagation()">

    <h3>Add availability</h3>

    <p>Connected as: <span id="modalPlayerName"></span></p>

    <input id="startHour" placeholder="Start">
    <input id="endHour" placeholder="End">

    <button id="saveAvailBtn">Save</button>
    <button id="closeAvailBtn">Close</button>

  </div>
</div>

<!-- EDIT -->
<div id="editModal" class="modal hidden" onclick="closeEditModal()">
  <div class="modal-content" onclick="event.stopPropagation()">

    <h3>Manage availability</h3>

    <p id="editInfo"></p>

    <input id="editStart">
    <input id="editEnd">

    <button id="updateBtn">Edit</button>
    <button id="deleteBtn">Delete</button>
    <button id="closeEditBtn">Close</button>

  </div>
</div>

<!-- USERNAME -->
<div id="usernameModal" class="modal hidden" onclick="closeUsernameModal()">
  <div class="modal-content" onclick="event.stopPropagation()">

    <h3>Username</h3>

    <input id="usernameInput">

    <button id="saveUsernameBtn">Save</button>
    <button id="closeUsernameBtn">Close</button>

  </div>
</div>

<!-- CHOICE -->
<div id="choiceModal" class="modal hidden" onclick="closeChoiceModal()">
  <div class="modal-content" onclick="event.stopPropagation()">

    <h3>What do you want to do?</h3>

    <button id="choiceAvailBtn">Availability</button>
    <button id="choiceEventBtn">Event</button>
    <button onclick="closeChoiceModal()">Close</button>

  </div>
</div>

<!-- EVENT -->
<div id="eventModal" class="modal hidden" onclick="closeEventModal()">
  <div class="modal-content" onclick="event.stopPropagation()">

    <h3>Create event</h3>

    <input id="eventTitle">
    <input id="eventStart">
    <input id="eventEnd">

    <button id="saveEventBtn">Save</button>
    <button onclick="closeEventModal()">Close</button>

  </div>
</div>

<!-- EVENT DETAIL -->
<div id="eventDetailModal" class="modal hidden" onclick="closeEventDetail()">
  <div class="modal-content" onclick="event.stopPropagation()">

    <h3 id="eventDetailTitle"></h3>
    <p id="eventDetailInfo"></p>

    <button id="btnYes">🟢 Available</button>
    <button id="btnNo">🔴 Not available</button>

    <h4>Players</h4>
    <div id="attendeesList"></div>

    <button onclick="closeEventDetail()">Close</button>

  </div>
</div>

<script type="module" src="script.js"></script>

</body>
</html>
