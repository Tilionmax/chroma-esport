<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chroma Esport Planning</title>

  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <h1>CHROMA ESPORT<br>Overwatch Team Schedule</h1>

  <!-- USER -->
  <div id="currentPlayerDisplay">
    <button id="changePlayerBtn" class="edit-btn">✏️Edit Username</button>
    <span id="playerText"></span>
  </div>

  <!-- CALENDAR -->
  <div id="calendar"></div>

  <!-- WEEK -->
  <div class="week-bar">
    <div id="weekRange"></div>
    <div id="weekDays"></div>
  </div>

  <!-- EVENTS -->
  <div class="stats">
    <h3>🔥 Events</h3>
    <div id="eventsList">Clique sur un jour</div>
  </div>

  <!-- PLAYERS -->
  <div class="stats">
    <h3>🟢 Available players</h3>
    <div id="playersList">Clique sur un jour</div>
  </div>

</div>

<!-- CHOICE MODAL -->
<div id="choiceModal" class="modal hidden">
  <div class="modal-content">

    <h3>Que veux-tu faire ?</h3>

    <button id="choiceAvailBtn">🟢 Disponibilité</button>
    <button id="choiceEventBtn">🔥 Event</button>
    <button id="closeChoiceBtn">Close</button>

  </div>
</div>

<!-- EVENT MODAL -->
<div id="eventModal" class="modal hidden">
  <div class="modal-content">

    <h3>Create Event</h3>

    <select id="eventType">
      <option value="🔥 Scrim">🔥 Scrim</option>
      <option value="🎯 Training">🎯 Training</option>
      <option value="🏆 Match">🏆 Match</option>
    </select>

    <input id="eventTitle" placeholder="Title">
    <input id="eventStart" placeholder="Start">
    <input id="eventEnd" placeholder="End">

    <button id="saveEventBtn">Save</button>
    <button id="closeEventBtn">Close</button>

  </div>
</div>

<!-- AVAILABILITY MODAL -->
<div id="availModal" class="modal hidden">
  <div class="modal-content">

    <h3>Add availability</h3>

    <input id="startHour" placeholder="Start">
    <input id="endHour" placeholder="End">

    <button id="saveAvailBtn">Save</button>
    <button id="closeAvailBtn">Close</button>

  </div>
</div>

<!-- USERNAME -->
<div id="usernameModal" class="modal hidden">
  <div class="modal-content">

    <h3>Username</h3>
    <input id="usernameInput" placeholder="Discord name">

    <button id="saveUsernameBtn">Save</button>
    <button id="closeUsernameBtn">Close</button>

  </div>
</div>

<script type="module" src="script.js"></script>

</body>
</html>
