<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Chroma Esport Planning</title>

  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <h1>CHROMA ESPORT<br>Planning Equipe EVA</h1>

  <div class="layout">

    <!-- EVENTS PANEL (GAUCHE) -->
    <div id="eventsPanel">
      <h3>🎮 Events</h3>
      <div id="eventsList">Chargement...</div>
    </div>

    <!-- CENTER -->
    <div class="center">

      <!-- CREATE EVENT (ADMIN ONLY) -->
      <div id="currenteventDisplay">
        <button id="createEventBtn" class="edit-btn">➕ Créer event</button>
      </div>

      <!-- USER -->
      <div id="currentPlayerDisplay">
        <button id="changePlayerBtn" class="edit-btn">✏️Modifier Pseudo</button>
        <span id="playerText"></span>
      </div>

      <!-- CALENDAR -->
      <div id="calendar"></div>

      <!-- WEEK -->
      <div class="week-bar">
        <div id="weekRange"></div>
        <div id="weekDays"></div>
      </div>

      <!-- PLAYERS -->
      <div class="stats">
        <h3>🟢 Joueur Disponible</h3>
        <div id="playersList">Clique sur un jour</div>
      </div>

    </div>
  </div>
</div>

<!-- AVAIL MODAL -->
<div id="availModal" class="modal hidden">
  <div class="modal-content">
    <h3>Ajouter une disponibilité</h3>

    <p style="color:#020f2a;font-weight:bold;">
      Connecté : <span id="modalPlayerName"></span>
    </p>

    <input id="startHour" placeholder="Début ex: 18h00">
    <input id="endHour" placeholder="Fin ex: 21h30">

    <button id="saveAvailBtn">Sauvegarder</button>
    <button id="closeAvailBtn">Fermer</button>
  </div>
</div>

<!-- USER MODAL -->
<div id="usernameModal" class="modal hidden">
  <div class="modal-content">

    <h3>Bienvenue</h3>

    <input id="usernameInput" placeholder="Pseudo Discord">

    <button id="saveUsernameBtn">Sauvegarder</button>
    <button id="closeUsernameBtn">Fermer</button>

  </div>
</div>

<!-- EVENT MODAL -->
<div id="eventModal" class="modal hidden">
  <div class="modal-content">

    <h3>Créer un event</h3>

    <input id="eventTitle" placeholder="Nom event">
    <input id="eventDate" type="date">
    <input id="eventStart" placeholder="Début">
    <input id="eventEnd" placeholder="Fin">

    <button id="saveEventBtn">Créer</button>
    <button id="closeEventBtn">Fermer</button>

  </div>
</div>

<script type="module" src="script.js"></script>

</body>
</html>
