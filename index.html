<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Chroma Esport Planning</title>

  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <h1>CHROMA ESPORT<br>Planning Equipe EVA</h1>

  <!-- LAYOUT AJOUTÉ -->
  <div class="layout">

    <!-- LEFT COLUMN -->
    <div class="left-panel">

      <div id="currenteventDisplay">
        <button id="createEventBtn" class="edit-btn">➕ Créer event</button>
      </div>

      <h3>📌 Events</h3>
      <div id="eventList"></div>

      <h3>👥 Participants</h3>

      <button id="attendBtn">Je participe</button>
      <button id="absentBtn">Je suis absent</button>

      <div id="participantsList"></div>

    </div>

    <!-- RIGHT -->
    <div class="right-panel">

      <div id="currentPlayerDisplay">
        <button id="changePlayerBtn" class="edit-btn">✏️Modifier Pseudo</button>
        <span id="playerText"></span>
      </div>

      <div id="calendar"></div>

      <div class="week-bar">
        <div id="weekRange"></div>
        <div id="weekDays"></div>
      </div>

      <div class="stats">
        <h3>🟢 Joueur Disponible</h3>
        <div id="playersList">Clique sur un jour</div>
      </div>

    </div>

  </div>
</div>

<!-- MODALS (INCHANGÉS) -->
<div id="availModal" class="modal hidden">
  <div class="modal-content">

    <h3>Ajouter une disponibilité</h3>

    <input id="startHour" placeholder="Début ex: 18h00">
    <input id="endHour" placeholder="Fin ex: 21h30">

    <button id="saveAvailBtn">Sauvegarder</button>
    <button id="closeAvailBtn">Fermer</button>

  </div>
</div>

<div id="editModal" class="modal hidden">
  <div class="modal-content">

    <h3>Gérer la disponibilité</h3>

    <p id="editInfo"></p>

    <input id="editStart">
    <input id="editEnd">

    <button id="updateBtn">Modifier</button>
    <button id="deleteBtn">Supprimer</button>
    <button id="closeEditBtn">Fermer</button>

  </div>
</div>

<div id="usernameModal" class="modal hidden">
  <div class="modal-content">

    <h3>Pseudo</h3>
    <input id="usernameInput">

    <button id="saveUsernameBtn">Sauvegarder</button>
    <button id="closeUsernameBtn">Fermer</button>

  </div>
</div>

<div id="eventModal" class="modal hidden">
  <div class="modal-content">

    <h3>Créer event</h3>

    <input id="eventTitle">
    <input id="eventDate" type="date">
    <input id="eventStart">
    <input id="eventEnd">

    <button id="saveEventBtn">Créer</button>
    <button id="closeEventBtn">Fermer</button>

  </div>
</div>

<script type="module" src="script.js"></script>

</body>
</html>
