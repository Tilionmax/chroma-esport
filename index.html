<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Chroma Esport Planning</title>

  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
  <h1>Overwatch Team Schedule</h1>

  <div id="calendar"></div>

  <!-- 🟢 LISTE JOUEURS -->
  <div class="stats">
    <h3>🟢 Joueurs disponibles</h3>
    <div id="playersList">Clique sur un jour</div>
  </div>
</div>

<!-- MODAL AJOUT -->
<div id="availModal" class="modal hidden" onclick="closeAddBackdrop(event)">
  <div class="modal-content" onclick="event.stopPropagation()">

    <h3>Add availability</h3>

    <input id="playerName" placeholder="Username">
    <input id="startHour" placeholder="HH:MM">
    <input id="endHour" placeholder="HH:MM">

    <button id="saveAvailBtn">Save</button>
    <button id="closeAvailBtn">Close</button>

  </div>
</div>

<!-- MODAL EDIT -->
<div id="editModal" class="modal hidden" onclick="closeEditBackdrop(event)">
  <div class="modal-content" onclick="event.stopPropagation()">

    <h3>Manage availability</h3>

    <p id="editInfo"></p>

    <input id="editStart" placeholder="HH:MM">
    <input id="editEnd" placeholder="HH:MM">

    <button id="updateBtn">Edit</button>
    <button id="deleteBtn">Delete</button>
    <button onclick="closeEditModal()">Close</button>

  </div>
</div>

<script type="module" src="script.js"></script>

</body>
</html>
