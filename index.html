<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Chroma Esport Planning</title>

  <link rel="stylesheet" href="style.css">

  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
</head>

<body>

<div class="container">
  <h1>📅 Chroma Esport Planning</h1>

  <div id="calendar"></div>

  <div class="stats">
    <h3>📊 Infos</h3>
    <div id="stats">Clique sur une date</div>
  </div>
</div>

<!-- MODAL EVENT -->
<div id="modal" class="modal hidden">
  <div class="modal-content">

    <h2>➕ Créer un entraînement</h2>

    <input id="title" placeholder="Nom de la session">

    <button id="saveBtn">Créer</button>
    <button id="closeBtn">Annuler</button>

  </div>
</div>

<!-- MODAL DISPONIBILITÉ -->
<div id="availModal" class="modal hidden">
  <div class="modal-content">

    <h2>🕒 Disponibilité joueur</h2>

    <input id="playerName" placeholder="Nom joueur">

    <input id="startHour" type="number" placeholder="Heure début (ex: 18)">
    <input id="endHour" type="number" placeholder="Heure fin (ex: 22)">

    <button id="saveAvailBtn">Valider</button>
    <button id="closeAvailBtn">Annuler</button>

  </div>
</div>

<script type="module" src="script.js"></script>

</body>
</html>
